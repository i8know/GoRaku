name: Deploy ke GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositori beserta aset Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Siapkan Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Pasang dependensi
        run: npm ci

      - name: Jalankan verifikasi tipe, tes, dan build dasar
        run: npm run verify

      - name: Build produksi untuk subpath GitHub Pages
        env:
          APP_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Pastikan aset biner Git LFS valid di dist/
        run: node tools/checkLfsAssets.mjs --strict

      - name: Siapkan fallback SPA 404.html untuk GitHub Pages
        run: cp -f dist/index.html dist/404.html

      - name: Unggah artefak GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
