name: Deploy ke GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositori beserta aset Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Siapkan Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Pasang dependensi
        run: npm ci

      - name: Jalankan verifikasi tipe, tes, dan build dasar
        run: npm run verify

      - name: Build produksi untuk subpath GitHub Pages
        env:
          APP_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node -e '
            const url = (process.env.VITE_SUPABASE_URL || "").trim();
            const key = (process.env.VITE_SUPABASE_PUBLISHABLE_KEY || "").trim();
            if (!url || !key) {
              console.error("Error: VITE_SUPABASE_URL dan VITE_SUPABASE_PUBLISHABLE_KEY wajib disetel pada Repository Variables/Secrets GitHub sebelum deploy produksi.");
              process.exit(1);
            }
            if (key.startsWith("sb_secret_")) {
              console.error("Error keamanan: VITE_SUPABASE_PUBLISHABLE_KEY tidak boleh memakai kunci sb_secret_.");
              process.exit(1);
            }
            const parts = key.split(".");
            if (parts.length === 3) {
              try {
                const payload = JSON.parse(Buffer.from(parts[1], "base64url").toString("utf8"));
                if (payload && payload.role === "service_role") {
                  console.error("Error keamanan: VITE_SUPABASE_PUBLISHABLE_KEY tidak boleh memakai JWT role service_role.");
                  process.exit(1);
                }
              } catch {}
            }
          '
          npm run build

      - name: Pastikan aset biner Git LFS valid di dist/
        run: node tools/checkLfsAssets.mjs --strict

      - name: Siapkan fallback SPA 404.html untuk GitHub Pages
        run: cp -f dist/index.html dist/404.html

      - name: Unggah artefak GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
